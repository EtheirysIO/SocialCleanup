name: Build

# Every push to master, every pull request: restore, Release build, tests, and keep latest.zip as an artifact.
# A tag "v1.0.0.0" also publishes a GitHub Release and uploads to repo.etheirys.io on the latest (stable) channel.
# A tag with a suffix, "v1.0.1.0-test1", does the same as a GitHub pre-release on the testing channel.
# The numeric part of the tag must equal <Version> in SocialCleanup/SocialCleanup.csproj, and CHANGELOG.md must have a
# "## X.Y.Z.W" section for it; otherwise nothing is published.
on:
  push:
    branches: [master]
    tags: ['v*']
    # Not evaluated for tag pushes, so a release is never skipped by these.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [master]
  workflow_dispatch: # builds and tests the selected ref; never publishes (see the release job's condition)

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tag v1.0.0.0 -> 1.0.0.0, latest. Tag v1.0.1.0-test1 -> 1.0.1.0, testing. Otherwise the csproj version, none.
      # A tag that is malformed or does not match the csproj <Version> fails the run here.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $lines = ./.github/scripts/resolve-version.ps1 -Tag $env:TAG -Csproj SocialCleanup/SocialCleanup.csproj
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Dalamud
        uses: ./.github/actions/setup-dalamud

      # --locked-mode: fail instead of silently re-resolving if packages.lock.json is out of date.
      - name: Restore
        run: dotnet restore SocialCleanup.sln --locked-mode

      # The version comes from the csproj, which the step above checked against the tag.
      - name: Build (Release)
        run: dotnet build SocialCleanup.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test SocialCleanup.Tests/SocialCleanup.Tests.csproj -c Release --no-build

      - name: Check package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'bin/Release/SocialCleanup/latest.zip'
          if (-not (Test-Path $zip)) { throw "$zip was not produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = $archive.Entries.FullName
            Write-Host "latest.zip: $($entries -join ', ')"
            # images/icon.png is the plugin installer's icon (copied to the output by the csproj).
            foreach ($f in 'SocialCleanup.dll', 'SocialCleanup.json', 'images/icon.png') {
              if ($entries -notcontains $f) { throw "latest.zip is missing $f" }
            }
            $reader = [System.IO.StreamReader]::new($archive.GetEntry('SocialCleanup.json').Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          if ($manifest.AssemblyVersion -ne $env:VERSION) {
            throw "Packaged manifest AssemblyVersion $($manifest.AssemblyVersion) != $env:VERSION"
          }
          Write-Host "Packaged manifest: $($manifest.InternalName) $($manifest.AssemblyVersion), API $($manifest.DalamudApiLevel), RepoUrl $($manifest.RepoUrl)"

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: SocialCleanup-${{ steps.version.outputs.version }}
          path: bin/Release/SocialCleanup/latest.zip
          if-no-files-found: error

  # Tag pushes only. Order, chosen so a failure never leaves a public half-release behind:
  #   1. release notes from CHANGELOG.md (fails before anything is published),
  #   2. GitHub Release as a DRAFT (not public; a re-run reuses it),
  #   3. upload to repo.etheirys.io (the step users actually see),
  #   4. publish the draft.
  # If 1-3 fail, nothing is public: fix the cause and re-run the failed jobs. Step 4 runs only after the site accepted
  # the upload; if it fails, the error says the site already has the release and how to publish the draft by hand.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create, update and publish the GitHub Release
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      CHANNEL: ${{ needs.build.outputs.channel }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download plugin package
        uses: actions/download-artifact@v8
        with:
          name: SocialCleanup-${{ needs.build.outputs.version }}

      - name: Release notes from CHANGELOG.md
        run: |
          case "$CHANNEL" in latest|testing) ;; *) echo "::error::Unexpected channel '$CHANNEL'"; exit 1 ;; esac
          bash .github/scripts/changelog-notes.sh "$VERSION" CHANGELOG.md notes.md
          echo "Release notes for $TAG ($VERSION, $CHANNEL):"
          cat notes.md
          sha256sum latest.zip | tee latest.zip.sha256

      - name: GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          if [ "$CHANNEL" = testing ]; then prerelease=true; fi
          title="SocialCleanup $VERSION"
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" != true ]; then
              echo "::error::GitHub Release $TAG is already published. Releases are not re-published; bump the version and tag again."
              exit 1
            fi
            echo "Reusing the draft GitHub Release $TAG from an earlier attempt."
            gh release upload "$TAG" latest.zip latest.zip.sha256 --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease="$prerelease"
          else
            flags=(--draft --verify-tag --title "$title" --notes-file notes.md)
            if [ "$prerelease" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" latest.zip latest.zip.sha256 "${flags[@]}"
          fi

      - name: Upload to repo.etheirys.io
        env:
          ETHEIRYS_CI_TOKEN: ${{ secrets.ETHEIRYS_CI_TOKEN }}
        run: |
          if [ -z "$ETHEIRYS_CI_TOKEN" ]; then
            echo "::error::The ETHEIRYS_CI_TOKEN repository secret is not set. Nothing was published; the GitHub Release is still a draft."
            exit 1
          fi
          extra=()
          if [ "$CHANNEL" = latest ]; then extra+=(--form-string "applicable_version=any"); fi
          if ! curl --fail-with-body -sS \
            -H "Authorization: Bearer $ETHEIRYS_CI_TOKEN" \
            -F "plugin=@latest.zip" \
            --form-string "changelog=$(cat notes.md)" \
            "${extra[@]}" \
            "https://repo.etheirys.io/api/ci/plugin/socialcleanup/upload/$CHANNEL"; then
            echo "::error::Upload to repo.etheirys.io ($CHANNEL) failed. The GitHub Release is still a draft; fix the cause and re-run the failed jobs."
            exit 1
          fi
          echo
          echo "Uploaded $VERSION to repo.etheirys.io ($CHANNEL)."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release edit "$TAG" --draft=false; then
            echo "::error::repo.etheirys.io already serves $VERSION ($CHANNEL), but publishing the draft GitHub Release failed. Do NOT re-run this job (it would upload again); publish the draft by hand: gh release edit $TAG --draft=false"
            exit 1
          fi
