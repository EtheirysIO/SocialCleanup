name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.0.0.0'
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release and push repo.json to master

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $version = ./.github/scripts/resolve-version.ps1 -Tag $env:TAG -Csproj SocialCleanup/SocialCleanup.csproj
          Write-Host "Releasing $env:TAG as $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Dalamud
        uses: ./.github/actions/setup-dalamud

      - name: Restore
        run: dotnet restore SocialCleanup.sln --locked-mode

      - name: Build (Release)
        shell: pwsh
        run: dotnet build SocialCleanup.sln -c Release -p:Platform=x64 --no-restore "-p:Version=$env:VERSION"

      - name: Test
        run: dotnet test SocialCleanup.Tests/SocialCleanup.Tests.csproj -c Release --no-build

      - name: Check package
        shell: pwsh
        run: |
          $zip = 'bin/Release/SocialCleanup/latest.zip'
          if (-not (Test-Path $zip)) { throw "$zip was not produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          Write-Host "latest.zip: $($entries -join ', ')"
          foreach ($f in 'SocialCleanup.dll', 'SocialCleanup.json') {
            if ($entries -notcontains $f) { throw "latest.zip is missing $f" }
          }
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  latest.zip' |
            Out-File -FilePath bin/Release/SocialCleanup/latest.zip.sha256 -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = 'bin/Release/SocialCleanup/latest.zip', 'bin/Release/SocialCleanup/latest.zip.sha256'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            gh release create $env:TAG @assets --verify-tag --title "SocialCleanup $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }

      - name: Update repo.json on master
        shell: pwsh
        env:
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.TAG }}/latest.zip
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep the scripts and the packaged manifest from the tagged build; switch the working tree to master.
          $tmp = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item bin/Release/SocialCleanup/SocialCleanup.json (Join-Path $tmp 'manifest.json')
          Copy-Item .github/scripts/write-repo-json.ps1 (Join-Path $tmp 'write-repo-json.ps1')

          git fetch --no-tags origin master
          git checkout -B master origin/master
          if ($LASTEXITCODE -ne 0) { throw 'git checkout master failed' }

          & (Join-Path $tmp 'write-repo-json.ps1') -Manifest (Join-Path $tmp 'manifest.json') -ExpectedVersion $env:VERSION -DownloadUrl $env:DOWNLOAD_URL -OutFile repo.json
          Get-Content repo.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'repo.json unchanged'; exit 0 }
          git commit -m "Update repo.json for $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin master
          if ($LASTEXITCODE -ne 0) { throw 'git push failed (did master move, or is it protected?)' }
